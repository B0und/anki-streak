name: Publish signed APK

on:
  push:
    branches:
      - 'release-assets/v*'

permissions:
  contents: write

concurrency:
  group: publish-android-stable
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_BRANCH: ${{ github.ref_name }}
      STAGING_COMMIT: ${{ github.sha }}
    steps:
      - name: Verify staged APK and publish
        shell: bash
        run: |
          set -eEuo pipefail
          trap 'echo "::error::Release command failed at line $LINENO: $BASH_COMMAND"' ERR
          tag=${RELEASE_BRANCH#release-assets/}
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir release
          cd release
          gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.ref' | grep -Fx "refs/tags/$tag"
          for file in Anki-Streak.apk SHA256SUMS.txt release-notes.md; do
            curl --fail --silent --show-error --location --retry 2 \
              "https://raw.githubusercontent.com/$GH_REPO/$STAGING_COMMIT/.release/$file" --output "$file"
          done
          [[ "$(cat SHA256SUMS.txt)" =~ ^[0-9a-f]{64}\ \ Anki-Streak\.apk$ ]]
          sha256sum -c SHA256SUMS.txt

          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          signer=$("$tools_dir/apksigner" verify --print-certs Anki-Streak.apk)
          fingerprint=$(sed -nE 's/^.*[Ss]igner[^:]*:? certificate SHA-256 digest: ([a-f0-9]{64})$/\1/p' <<< "$signer" | sort -u)
          if [[ "$fingerprint" != 15ccfdb1ab164994b925cbe9667218be7073815cf7892af5c43300fed06e9a13 ]]; then
            echo "::error::APK certificate does not match Anki Streak's release key"
            exit 1
          fi
          echo "Release certificate verified"
          badging=$("$tools_dir/aapt2" dump badging Anki-Streak.apk)
          package=${badging%%$'\n'*}
          [[ "$package" == "package: name='com.ankistreak.anime' "* ]]
          [[ "$package" == *" versionName='${tag#v}' "* ]]

          apk_version_code() {
            local metadata
            metadata=$("$tools_dir/aapt2" dump badging "$1")
            sed -nE "1s/^package: .*versionCode='([0-9]+)'.*$/\1/p" <<< "$metadata"
          }
          version_code=$(apk_version_code Anki-Streak.apk)
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]

          if gh release view "$tag" --json isDraft --jq .isDraft | grep -qx false; then
            gh release download "$tag" --pattern Anki-Streak.apk --output published.apk
            cmp Anki-Streak.apk published.apk
          else
            previous_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
            gh release download "$previous_tag" --pattern Anki-Streak.apk --output previous.apk
            previous_code=$(apk_version_code previous.apk)
            [[ "$previous_code" =~ ^[1-9][0-9]*$ ]]
            if (( version_code <= previous_code )); then
              echo "::error::APK versionCode $version_code must exceed $previous_tag versionCode $previous_code"
              exit 1
            fi
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --verify-tag --draft --title "Anki Streak $tag" --notes-file release-notes.md
            fi
            gh release upload "$tag" Anki-Streak.apk SHA256SUMS.txt --clobber
            gh release edit "$tag" --draft=false --latest
          fi
